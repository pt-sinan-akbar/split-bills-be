when:
  - event: [push, manual]

steps:
  - name: publish
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/pt-sinan-akbar/split-bills-be
      dockerfile: Dockerfile
      platforms: linux/amd64
      tags: ${CI_COMMIT_SHA:0:7}
      cache_images:
        - ghcr.io/pt-sinan-akbar/split-bills-be:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
